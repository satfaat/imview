<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>▶ playback console</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script src="common/elements/bm-player.js"></script>
<style>
  :root{
    --bg:        #0b0d10;
    --panel:     #12151a;
    --panel-2:   #171b21;
    --line:      #232830;
    --text:      #d9dee5;
    --dim:       #6b7480;
    --accent:    #7de1c3;   /* signal green */
    --accent-2:  #e17d6b;   /* warn/rec red-orange */
    --mono: "JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #10221c33, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .console{
    width:100%;
    max-width:920px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 40px 80px -30px #000000cc, 0 0 0 1px #ffffff05 inset;
  }

  /* ---- title bar ---- */
  .bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#2b3038;}
  .bar .label{
    margin-left:6px;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .bar .state{
    margin-left:auto;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--dim);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .state .pulse{
    width:6px;height:6px;border-radius:50%;
    background:var(--dim);
  }
  .state.live .pulse{
    background:var(--accent);
    box-shadow:0 0 0 0 rgba(125,225,195,.6);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(125,225,195,.45);}
    70%{box-shadow:0 0 0 8px rgba(125,225,195,0);}
    100%{box-shadow:0 0 0 0 rgba(125,225,195,0);}
  }

  /* ---- input row ---- */
  .intake{
    display:flex;
    gap:8px;
    padding:16px;
    border-bottom:1px solid var(--line);
    background:
      linear-gradient(180deg, #ffffff02, transparent 40%),
      var(--panel);
  }
  .intake .prompt{
    display:flex;
    align-items:center;
    color:var(--accent);
    font-size:14px;
    padding:0 4px;
    user-select:none;
  }
  .intake input{
    flex:1;
    background:#0d1014;
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:13px;
    padding:11px 12px;
    border-radius:6px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .intake input::placeholder{color:#48505a;}
  .intake input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px #7de1c31f;
  }
  .intake button{
    background:var(--accent);
    color:#08110d;
    border:none;
    font-family:var(--mono);
    font-weight:700;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:0 18px;
    border-radius:6px;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  .intake button:hover{filter:brightness(1.08);}
  .intake button:active{transform:scale(.97);}
  .intake button:disabled{
    background:var(--panel-2);
    color:var(--dim);
    cursor:not-allowed;
  }

  .referer-row{
    padding-top:0;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .ref-label{
    color:var(--dim);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding:0 6px;
  }
  .referer-row input{font-size:12.5px;}
  .referer-row .btn{
    white-space:nowrap;
    font-size:11px;
    padding:0 14px;
  }

  .ref-policy{
    background:#0d1014;
    border:1px solid var(--line);
    color:var(--dim);
    font-family:var(--mono);
    font-size:11px;
    padding:0 8px;
    border-radius:6px;
    outline:none;
    cursor:pointer;
  }
  .ref-policy:hover{color:var(--text); border-color:var(--accent);}

  .hint{
    padding:0 16px 14px 16px;
    font-size:11px;
    line-height:1.5;
    color:var(--dim);
    border-bottom:1px solid var(--line);
    margin-top:-4px;
  }
  .hint em{color:var(--text); font-style:normal;}

  .error{
    padding:0 16px 14px 16px;
    font-size:12px;
    color:var(--accent-2);
    margin-top:-4px;
  }
  .error::before{content:"! "; opacity:.8;}

  /* ---- stage ---- */
  .stage{
    position:relative;
    background:#000;
    aspect-ratio:16/9;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
  }
  .empty{
    color:var(--dim);
    font-size:12px;
    letter-spacing:.1em;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .empty svg{opacity:.35;}
  .spinner{
    width:34px;height:34px;
    border-radius:50%;
    border:2px solid #ffffff14;
    border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- footer / meta + actions ---- */
  .footer{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    background:var(--panel-2);
    border-top:1px solid var(--line);
    flex-wrap:wrap;
  }
  .meta{
    font-size:11px;
    color:var(--dim);
    display:flex;
    gap:16px;
    flex-wrap:wrap;
  }
  .meta b{color:var(--text); font-weight:600;}

  .actions{margin-left:auto; display:flex; gap:8px;}
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    text-decoration:none;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{
    border-color:transparent;
    background:var(--accent);
    color:#08110d;
    font-weight:700;
  }
  .btn.primary:hover{filter:brightness(1.08); color:#08110d;}
  .btn:disabled{opacity:.35; cursor:not-allowed; border-color:var(--line); color:var(--dim); background:transparent;}
  .btn svg{width:13px;height:13px;}

  .dl-progress{
    font-size:11px;
    color:var(--accent);
    min-width:34px;
    text-align:right;
  }

  @media (max-width:560px){
    .intake{flex-wrap:wrap;}
    .intake .prompt{display:none;}
    .footer{gap:10px;}
    .actions{width:100%; margin-left:0;}
    .btn{flex:1; justify-content:center;}
  }
</style>
</head>
<body>

<div class="console"
     x-data="playerConsole()"
     x-init="init()">

  <div class="bar">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <span class="label">playback console</span>
    <span class="state" :class="{live: status==='ready' || status==='playing'}">
      <span class="pulse"></span>
      <span x-text="statusLabel"></span>
    </span>
  </div>

  <form class="intake" @submit.prevent="load()">
    <span class="prompt">&gt;</span>
    <input
      type="text"
      x-model="urlInput"
      placeholder="paste video url — .mp4, .webm, .mov…"
      autocomplete="off"
      spellcheck="false"
    >
    <button type="submit" :disabled="status==='loading'" x-text="status==='loading' ? 'loading…' : 'load'"></button>
  </form>

  <div class="intake referer-row">
    <span class="prompt ref-label">ref</span>
    <input
      type="text"
      x-model="refererInput"
      placeholder="referer for ffmpeg cmd (optional) — https://example.com/"
      autocomplete="off"
      spellcheck="false"
    >
    <select class="ref-policy" x-model="referrerPolicy" title="controls what referrer info THIS page sends to the video host — cannot forge a different site's referrer">
      <option value="strict-origin-when-cross-origin">policy: default</option>
      <option value="no-referrer">policy: no-referrer</option>
      <option value="origin">policy: origin only</option>
      <option value="unsafe-url">policy: full url</option>
    </select>
    <button type="button" class="btn" @click="copyFfmpegCmd()" x-text="cmdCopied ? 'copied' : 'copy ffmpeg cmd'"></button>
  </div>
  <div class="hint">Browsers block JS from forging a Referer for another site — the field above only feeds the ffmpeg command. The dropdown controls whether <em>this</em> page's own referrer is sent to the video host.</div>

  <template x-if="error">
    <div class="error" x-text="error"></div>
  </template>

  <div class="stage">
    <template x-if="!currentSrc">
      <div class="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <path d="M8 6.5v11l9-5.5-9-5.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <span>no signal — paste a link above</span>
      </div>
    </template>

    <template x-if="status==='loading'">
      <div class="spinner"></div>
    </template>

    <bm-player
      x-show="currentSrc"
      x-ref="player"
      :src="currentSrc"
      :referrerpolicy="referrerPolicy"
      @loadedmetadata="onMeta($event)"
      @playing="status='playing'"
      @pause="status = currentSrc ? 'ready' : status"
      @error="onVideoError($event)"
      style="width:100%; height:100%;"
    ></bm-player>
  </div>

  <div class="footer">
    <div class="meta">
      <span>duration <b x-text="durationLabel"></b></span>
      <span>size <b x-text="sizeLabel"></b></span>
      <span>format <b x-text="formatLabel"></b></span>
    </div>
    <div class="actions">
      <button class="btn" :disabled="!currentSrc" @click="copyLink()">
        <span x-text="copied ? 'copied' : 'copy link'"></span>
      </button>
      <span class="dl-progress" x-show="dlProgress" x-text="dlProgress"></span>
      <button class="btn primary" :disabled="!currentSrc || downloading" @click="download()">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span x-text="downloading ? 'saving…' : 'download'"></span>
      </button>
    </div>
  </div>
</div>

<script>
function playerConsole(){
  return {
    urlInput: '',
    refererInput: '',
    referrerPolicy: 'strict-origin-when-cross-origin',
    cmdCopied: false,
    currentSrc: '',
    status: 'idle',       // idle | loading | ready | playing | error
    error: '',
    duration: 0,
    sizeBytes: null,
    copied: false,
    downloading: false,
    dlProgress: '',

    init(){
      // restore last session, if any
      const last = sessionStorage.getItem('pc_lastUrl');
      if(last){ this.urlInput = last; }
    },

    get statusLabel(){
      return { idle:'idle', loading:'loading', ready:'ready', playing:'playing', error:'error' }[this.status] || 'idle';
    },
    get durationLabel(){
      if(!this.duration) return '—';
      const m = Math.floor(this.duration/60);
      const s = Math.floor(this.duration%60).toString().padStart(2,'0');
      return `${m}:${s}`;
    },
    get sizeLabel(){
      if(this.sizeBytes == null) return '—';
      const mb = this.sizeBytes / (1024*1024);
      return mb >= 1 ? `${mb.toFixed(1)} MB` : `${(this.sizeBytes/1024).toFixed(0)} KB`;
    },
    get formatLabel(){
      if(!this.currentSrc) return '—';
      const match = this.currentSrc.split('?')[0].match(/\.([a-zA-Z0-9]+)$/);
      return match ? match[1].toUpperCase() : 'unknown';
    },

    validUrl(str){
      try{
        const u = new URL(str);
        return u.protocol === 'http:' || u.protocol === 'https:';
      }catch(e){ return false; }
    },

    async load(){
      this.error = '';
      const url = this.urlInput.trim();
      if(!url){ this.error = 'paste a url first'; return; }
      if(!this.validUrl(url)){ this.error = 'that doesn\'t look like a valid http(s) url'; return; }

      this.status = 'loading';
      this.duration = 0;
      this.sizeBytes = null;
      this.currentSrc = url;
      sessionStorage.setItem('pc_lastUrl', url);

      // best-effort content-length via HEAD (may fail on cross-origin/no-CORS sources — that's fine)
      try{
        const res = await fetch(url, { method:'HEAD' });
        const len = res.headers.get('content-length');
        if(len) this.sizeBytes = parseInt(len, 10);
      }catch(e){ /* silently ignore — many CDNs block HEAD or CORS */ }

      this.$nextTick(() => this.$refs.player && this.$refs.player.load());
    },

    onMeta(e){
      const detail = e && e.detail;
      this.duration = (detail && detail.duration) || (e && e.target && e.target.duration) || (this.$refs.player && this.$refs.player.duration) || 0;
      if(this.status === 'loading') this.status = 'ready';
    },

    onVideoError(e){
      this.status = 'error';
      const msg = e && e.detail && e.detail.message;
      this.error = msg || 'couldn\'t load that source — check the link, or the host may block playback';
    },

    async copyFfmpegCmd(){
      const url = (this.urlInput || this.currentSrc || '').trim();
      if(!url){ this.error = 'paste a url first'; return; }
      const name = url.split('/').pop().split('?')[0] || 'video.mp4';
      let cmd;
      if(this.refererInput.trim()){
        cmd = `ffmpeg -headers "Referer: ${this.refererInput.trim()}\\r\\n" -i "${url}" -c copy ${name}`;
      } else {
        cmd = `ffmpeg -i "${url}" -c copy ${name}`;
      }
      try{
        await navigator.clipboard.writeText(cmd);
        this.cmdCopied = true;
        setTimeout(() => this.cmdCopied = false, 1600);
      }catch(e){
        // clipboard blocked — surface the command so it can be copied manually
        this.error = `couldn't access clipboard — here's the command: ${cmd}`;
      }
    },

    async copyLink(){
      try{
        await navigator.clipboard.writeText(this.currentSrc);
        this.copied = true;
        setTimeout(() => this.copied = false, 1400);
      }catch(e){ /* clipboard blocked — ignore quietly */ }
    },

    async download(){
      if(!this.currentSrc) return;
      this.downloading = true;
      this.dlProgress = '0%';
      try{
        const res = await fetch(this.currentSrc);
        if(!res.ok || !res.body) throw new Error('fetch failed');
        const total = parseInt(res.headers.get('content-length') || '0', 10);
        const reader = res.body.getReader();
        const chunks = [];
        let received = 0;
        while(true){
          const {done, value} = await reader.read();
          if(done) break;
          chunks.push(value);
          received += value.length;
          if(total) this.dlProgress = Math.round((received/total)*100) + '%';
        }
        const blob = new Blob(chunks);
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const name = this.currentSrc.split('/').pop().split('?')[0] || 'video.mp4';
        a.href = blobUrl;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(blobUrl);
      }catch(e){
        // fallback: cross-origin without CORS headers — open a direct link instead
        const a = document.createElement('a');
        a.href = this.currentSrc;
        a.download = '';
        a.target = '_blank';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
        this.error = 'direct download blocked by the host\'s CORS policy — opened the source in a new tab instead';
      }finally{
        this.downloading = false;
        this.dlProgress = '';
      }
    }
  }
}
</script>
</body>
</html>
